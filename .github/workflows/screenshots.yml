name: Screenshots

on:
  push:
    branches: [main]
    paths: [lib/**, assets/**, pubspec.yaml, tool/screenshots.mjs, .github/workflows/screenshots.yml]
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: Capture
        run: |
          cd build/web && python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          cp tool/screenshots.mjs /tmp/pw/shots.mjs
          cd /tmp/pw && node shots.mjs
          mkdir -p $GITHUB_WORKSPACE/shots && cp -r /tmp/pw/shots/* $GITHUB_WORKSPACE/shots/
      - name: Publish to screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
