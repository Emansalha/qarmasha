org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# تشغيل Kotlin داخل Gradle بدل برنامج منفصل (يتجنب: Could not connect to Kotlin compile daemon)
kotlin.compiler.execution.strategy=in-process

# أداء أفضل وتنزيلات أقل في البناءات التالية
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
# مهلة أطول للإنترنت البطيء
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
